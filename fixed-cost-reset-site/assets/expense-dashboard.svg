<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="title desc">
  <title id="title">固定費診断ダッシュボード</title>
  <desc id="desc">スマホ、電気、ネット、サブスクの月額費用をカードとグラフで整理した画面。</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#17211b" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="920" height="720" rx="44" fill="#dff5e7"/>
  <circle cx="744" cy="138" r="96" fill="#ffe69a"/>
  <circle cx="132" cy="590" r="126" fill="#dceeff"/>
  <g filter="url(#shadow)">
    <rect x="110" y="82" width="700" height="536" rx="28" fill="url(#screen)"/>
    <rect x="110" y="82" width="700" height="72" rx="28" fill="#17211b"/>
    <circle cx="152" cy="118" r="10" fill="#f06f4f"/>
    <circle cx="184" cy="118" r="10" fill="#ffe69a"/>
    <circle cx="216" cy="118" r="10" fill="#7fd0a4"/>
    <text x="262" y="126" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Fixed Cost Reset</text>
    <rect x="148" y="194" width="286" height="126" rx="18" fill="#ffffff" stroke="#dce4dd"/>
    <text x="174" y="232" fill="#607064" font-family="Arial, sans-serif" font-size="18" font-weight="700">削減余地</text>
    <text x="174" y="286" fill="#167a4a" font-family="Arial, sans-serif" font-size="54" font-weight="900">¥7,700</text>
    <rect x="468" y="194" width="304" height="126" rx="18" fill="#17211b"/>
    <text x="494" y="232" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">最初に見る項目</text>
    <text x="494" y="282" fill="#ffe69a" font-family="Arial, sans-serif" font-size="42" font-weight="900">スマホ料金</text>
    <g>
      <rect x="148" y="356" width="624" height="44" rx="12" fill="#f5f7f2"/>
      <rect x="148" y="356" width="470" height="44" rx="12" fill="#167a4a"/>
      <text x="170" y="384" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">スマホ</text>
      <text x="690" y="384" fill="#17211b" font-family="Arial, sans-serif" font-size="18" font-weight="700">¥2,500</text>
      <rect x="148" y="424" width="624" height="44" rx="12" fill="#f5f7f2"/>
      <rect x="148" y="424" width="338" height="44" rx="12" fill="#f06f4f"/>
      <text x="170" y="452" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">ネット</text>
      <text x="690" y="452" fill="#17211b" font-family="Arial, sans-serif" font-size="18" font-weight="700">¥2,200</text>
      <rect x="148" y="492" width="624" height="44" rx="12" fill="#f5f7f2"/>
      <rect x="148" y="492" width="278" height="44" rx="12" fill="#3d8ed8"/>
      <text x="170" y="520" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">電気</text>
      <text x="690" y="520" fill="#17211b" font-family="Arial, sans-serif" font-size="18" font-weight="700">¥1,800</text>
      <rect x="148" y="560" width="624" height="44" rx="12" fill="#f5f7f2"/>
      <rect x="148" y="560" width="186" height="44" rx="12" fill="#f0bb33"/>
      <text x="170" y="588" fill="#17211b" font-family="Arial, sans-serif" font-size="18" font-weight="700">サブスク</text>
      <text x="690" y="588" fill="#17211b" font-family="Arial, sans-serif" font-size="18" font-weight="700">¥1,200</text>
    </g>
  </g>
